
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cnm-reference"
version = "1.0.0"
description = "Auditable reference implementation of compositional navigation memory."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.24,<3",
  "pybullet>=3.2.5,<4",
  "gymnasium>=1.0,<2",
  "Pillow>=10,<12",
  "psutil>=5,<8",
]

[project.optional-dependencies]
train = ["torch>=2.4,<3", "matplotlib>=3.8,<4"]
test = ["pytest>=8,<9", "torch>=2.4,<3"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
